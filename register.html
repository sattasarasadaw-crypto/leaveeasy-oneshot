<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width:420px">
    <h1>🔧 LeaveEasy</h1>
    <p class="subtitle">สมัครสมาชิกใหม่ — บัญชีใหม่ทุกบัญชีเริ่มต้นเป็น "ผู้ขอลา" เสมอ</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มสมัคร">
        <label for="name">ชื่อ-นามสกุล</label>
        <input type="text" id="name" required>

        <label for="email">อีเมล</label>
        <input type="email" id="email" required>

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" required minlength="6">

        <div class="btn-row">
          <button type="submit" id="ปุ่มสมัคร">สมัครสมาชิก</button>
        </div>
      </form>

      <p class="hint">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </div>
  </div>

  <script type="module" src="js/register.js"></script>
</body>
</html>
